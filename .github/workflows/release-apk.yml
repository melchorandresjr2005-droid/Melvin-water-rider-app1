name: Build and Release APK

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Generate Gradle Wrapper
        run: gradle wrapper

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Sync App Version with Build Number
        run: |
          NEW_CODE=${{ github.run_number }}
          NEW_NAME="1.0.${{ github.run_number }}"
          echo "Setting versionCode=$NEW_CODE and versionName=$NEW_NAME"
          if [ -f app/build.gradle.kts ]; then
            sed -i -E "s/versionCode\s*=\s*[0-9]+/versionCode = $NEW_CODE/" app/build.gradle.kts
            sed -i -E "s/versionName\s*=\s*\"[^\"]+\"/versionName = \"$NEW_NAME\"/" app/build.gradle.kts
          elif [ -f app/build.gradle ]; then
            sed -i -E "s/versionCode\s+[0-9]+/versionCode $NEW_CODE/" app/build.gradle
            sed -i -E "s/versionName\s+\"[^\"]+\"/versionName \"$NEW_NAME\"/" app/build.gradle
          fi

      - name: Prepare Release Keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          SECRET_STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          SECRET_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          KEYSTORE_FILE="${{ github.workspace }}/app/my-upload-key.jks"
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_FILE"
            echo "KEYSTORE_PATH=$KEYSTORE_FILE" >> $GITHUB_ENV
            echo "STORE_PASSWORD=$SECRET_STORE_PASSWORD" >> $GITHUB_ENV
            echo "KEY_PASSWORD=$SECRET_KEY_PASSWORD" >> $GITHUB_ENV
          else
            echo "No RELEASE_KEYSTORE_BASE64 secret found; generating CI upload keystore."
            keytool -genkeypair -v \
              -keystore "$KEYSTORE_FILE" \
              -alias upload \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass android \
              -keypass android \
              -dname "CN=MelvinWaterRider, OU=Mobile, O=WaterRider, L=PH, ST=PH, C=PH"
            echo "KEYSTORE_PATH=$KEYSTORE_FILE" >> $GITHUB_ENV
            echo "STORE_PASSWORD=android" >> $GITHUB_ENV
            echo "KEY_PASSWORD=android" >> $GITHUB_ENV
          fi

      - name: Build Release APK
        run: ./gradlew assembleRelease

      - name: Rename APK for release
        run: |
          mkdir -p build/outputs/apk/release-out
          cp app/build/outputs/apk/release/app-release.apk build/outputs/apk/release-out/MelvinWaterRider-release.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v5
        with:
          name: MelvinWaterRider-APK
          path: build/outputs/apk/release-out/MelvinWaterRider-release.apk

      - name: Release to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Release v1.0.${{ github.run_number }}
          files: build/outputs/apk/release-out/MelvinWaterRider-release.apk
          fail_on_unmatched_files: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
